# Drills / Material Gathering / Pump
block.biomechazard-oil-derrick.name = Puits de Pétrole
block.biomechazard-oil-derrick.description = Fore le pétrole sous la croûte terrestre.\n\nNécessite de la vapeur pour fonctionner.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-pump.name = Pompe à Vapeur
block.biomechazard-steam-pump.description = Pompe et refoule du liquide à l'aide de vapeur à haute pression.\n[#199119]Unlimited Armament Works[]
block.biomechazard-pulsometer-pump.name = Pompe Pulsométrique
block.biomechazard-pulsometer-pump.description = Pompe et refoule de grandes quantités de liquide grâce à de la vapeur à haute pression.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-drill.name = Foreuse à Vapeur
block.biomechazard-steam-drill.description = Une foreuse à vapeur, capable d'extraire du minerai de titane.\nLe Pétrole peut être utilisée pour la lubrification, augmentant ainsi l'efficacité.\n[#199119]Unlimited Armament Works[]
block.biomechazard-advanced-steam-drill.name = Foreuse à Vapeur Avancée
block.biomechazard-advanced-steam-drill.description = Plus grande, plus rapide et plus performante qu'une Foreuse à Vapeur classique, elle est capable d'extraire des matériaux beaucoup plus durs. \nLe Pétrole peut être utilisée pour la lubrification, ce qui accroît son efficacité.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-thumper.name = Batteuse à Vapeur
block.biomechazard-steam-thumper.description = Injecte de la vapeur à haute pression sous les veines de charbon de surface, mettant au jour un combustible très puissant appelé anthracite.\n[#199119]Unlimited Armament Works[]
## Heat
block.biomechazard-copper-heat-node.name = Nœud Chauffant en Cuivre
block.biomechazard-copper-heat-node.description = Simple nœud chauffant en cuivre qui transfère la chaleur vers l'avant.\n[#199119]Unlimited Armament Works[]
block.biomechazard-composite-heat-node.name = Nœud Chauffant Hybride
block.biomechazard-composite-heat-node.description = Nœud chauffant durable qui transfère l'énergie et la chaleur vers l'avant. \nPeut être déployé sur l'[blue]eau[].\n[#199119]Unlimited Armament Works[]
## Liquid
block.biomechazard-pressurized-conduit.name = Conduit en Acier Robuste
block.biomechazard-pressurized-conduit.description = Permet une circulation rapide des liquides, possède un débit très élevé et supporte les liquides à haute température. Sans fuite.\n\nPeut être déployé sur l'[blue]eau[].\n[#199119]Unlimited Armament Works[]
block.biomechazard-plated-pressurized-conduit.name = Conduit en Acier Robuste Plaqué
block.biomechazard-plated-pressurized-conduit.description = Permet une circulation rapide des liquides, possède un débit très élevé et supporte les liquides à haute température.\nN'accepte pas les entrées latérales. Sans fuite.\n\nPeut être déployé sur l'[blue]eau[].\n[#199119]Unlimited Armament Works[]
block.biomechazard-pressurized-liquid-router.name = Routeur de Liquide en Acier Robuste
block.biomechazard-pressurized-liquid-router.description = Accepte les liquides provenant d'une direction et les distribue de manière égale jusqu'à 3 autres directions. Compatible avec le débit d'un conduit sous pression. Blindage renforcé.\n[#199119]Unlimited Armament Works[]
block.biomechazard-pressurized-liquid-junction.name = Jonction de Liquide en Acier Robuste
block.biomechazard-pressurized-liquid-junction.description = Permet de faire avancer rapidement les liquides. S'utilise avec des pompes et autres conduits. Blindage renforcé.\n[#199119]Unlimited Armament Works[]
block.biomechazard-pressurized-liquid-bridge.name = Pont de Liquide en Acier Robuste
block.biomechazard-pressurized-liquid-bridge.description = Transporte les liquides par-dessus les terrains ou les bâtiments plus rapidement et sur de plus longues distances qu'un pont de liquide standard. Blindage renforcé.\n[#199119]Unlimited Armament Works[]
## Power
block.biomechazard-petroleum-generator.name = Générateur à Pétrole
block.biomechazard-petroleum-generator.description = Génère une grande quantité d'énergie par combustion du pétrole. Explose lorsqu'il est détruit. \nNécessite un minimum d'énergie pour démarrer le processus.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-turbine.name = Turbine à Vapeur
block.biomechazard-steam-turbine.description = Utilise la vapeur pour produire de l'énergie. Celle-ci est ensuite condensée en eau.\n[#199119]Unlimited Armament Works[]
block.biomechazard-advanced-steam-turbine.name = Turbine à Vapeur Avancée
block.biomechazard-advanced-steam-turbine.description = Utilise la vapeur pour produire une grande quantité d'énergie. Celle-ci est ensuite condensée en eau.\n[#199119]Unlimited Armament Works[]
## Steam
block.biomechazard-steam-kettle.name = Bouilloire à Vapeur
block.biomechazard-steam-kettle.description = Fait bouillir de l'eau pour produire de la vapeur.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-kettle.details = Petite et rudimentaire, elle pouvait aussi servir à fabriquer des nouilles instantanées.
block.biomechazard-industrial-boiler.name = Chaudière Industrielle
block.biomechazard-industrial-boiler.description = Génère de la vapeur en faisant bouillir de l'eau avec des matériaux inflammables.\n[#199119]Unlimited Armament Works[]
block.biomechazard-industrial-boiler.details = Une chaudière à renforts intérieurs permet à cette machine de fonctionner avec divers matériaux inflammables, à condition qu'ils ne soient pas explosifs.
block.biomechazard-pressure-boiler.name = Chaudière à Pression
block.biomechazard-pressure-boiler.description = Génère de la vapeur de manière nettement plus efficace en faisant bouillir de l'eau avec des matériaux inflammables.\n[#199119]Unlimited Armament Works[]
block.biomechazard-pressure-boiler.details = L'eau est chauffée sous une pression intense, ce qui lui permet de bouillir au-dessus de sa température d'ébullition.
block.biomechazard-geothermal-boiler.name = Chaudière Géothermique
block.biomechazard-geothermal-boiler.description = Génère de la vapeur s'il est placé dans un endroit chaud.\n[#199119]Unlimited Armament Works[]
## Heat
block.biomechazard-vapour-heater.name = Chauffage à Vapeur
block.biomechazard-vapour-heater.description = Utilise la vapeur pour générer de la chaleur et de l'eau.\n[#199119]Unlimited Armament Works[]
block.biomechazard-coal-burner.name = Brûleur à charbon
block.biomechazard-coal-burner.description = Produit de la chaleur par combustion du charbon.\n[#199119]Unlimited Armament Works[]
block.biomechazard-lpg-heater.name = Chauffage au gaz
block.biomechazard-lpg-heater.description = Produit de la chaleur par combustion de gaz de pétrole.\n[#199119]Unlimited Armament Works[]
# Crafters
block.biomechazard-alloy-crucible.name = Creuset d'alliage
block.biomechazard-alloy-crucible.description = Il mélange de la poussière d'anthracite et d'autres matériaux pour produire un alliage extraordinairement dense et durable connu sous le nom d'"Acier Robuste".\n[#199119]Unlimited Armament Works[]
block.biomechazard-gelatinizer.name = Gélatiniseur de Liquide Cryogénique
block.biomechazard-gelatinizer.description = Produit du Cryogel. Un composé très froid pourtant gélatineux.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gelatinizer.details = Le Liquide Cryogénique peut être gélatinisé en cryogel par ensablage, ce qui permet un stockage plus pratique et des utilisations plus polyvalentes.
block.biomechazard-cryofluid-blender.name = Mélangeur de Liquide Cryogénique
block.biomechazard-cryofluid-blender.description = Mélange rapidement de l'eau avec de la poudre fine de titane pour produire du Liquide Cryogénique.\n[#199119]Unlimited Armament Works[]
block.biomechazard-plastanium-fabricator.name = Fabrique de Plastanium
block.biomechazard-plastanium-fabricator.description = Produit rapidement du plastanium à partir de pétrole et de titane.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-press.name = Presse à Vapeur
block.biomechazard-steam-press.description = Comprime rapidement le charbon en graphite.\n[#199119]Unlimited Armament Works[]
block.biomechazard-petrochemical-centrifuge.name = Centrifugeuse Pétrochimique
block.biomechazard-petrochemical-centrifuge.description = Transforme le pétrole en charbon et en anthracite.\n[#199119]Unlimited Armament Works[]
block.biomechazard-petrochemical-centrifuge.details = Je ne sais pas comment ça fonctionne, à ce stade, au diable le réalisme.
block.biomechazard-petroleum-crucible.name = Creuset pétrolier
block.biomechazard-petroleum-crucible.description = Produit du silicium et du verre trempé à un rythme très élevé en utilisant du pétrole comme combustible.\n[#199119]Unlimited Armament Works[]
## Machine Guns [MG]
block.biomechazard-quadra.name = Quadra
block.biomechazard-quadra.description = Tire rapidement des projectiles grâce à ses deux canons parallèles.\n[#199119]Unlimited Armament Works[]
block.biomechazard-quadra.details = Son double canon juxtaposé renforcé permet au Quadra de maintenir une cadence de tir élevée pendant une période prolongée.
block.biomechazard-spitfire.name = Spitfire
block.biomechazard-spitfire.description = Tire à une vitesse incroyable. Limité aux cibles terrestres.\n[#199119]Unlimited Armament Works[]
block.biomechazard-spitfire.details = Déchaîne des torrents de projectiles avec une férocité implacable.
## Shot-cannons [SG]
block.biomechazard-buckshot.name = Buckshot
block.biomechazard-buckshot.description = Tourelle à courte portée, tire plusieurs grenailles par tir.\n[#199119]Unlimited Armament Works[]
block.biomechazard-buckshot.details = Un fusil de chasse comiquement surdimensionné, monté sur un socle renforcé et d'une efficacité surprenante malgré son âge.
block.biomechazard-tempest.name = Tempest
block.biomechazard-tempest.description = Cadence de tir élevée, tire plusieurs grenailles et consomme beaucoup de munitions\n\nPriorise les ennemis volants par rapport aux ennemis terrestres.\n[#199119]Unlimited Armament Works[]
block.biomechazard-tempest.details = Un canon à projectiles automatique en configuration Gatling. Ce qu'il perd en puissance de feu, il le gagne en efficacité, déchaînant un véritable déluge de projectiles dans sa zone de portée.
block.biomechazard-strikeforce.name = Strikeforce
block.biomechazard-strikeforce.description = Cadence de tir lente, mais absolument dévastateur à courte portée.\n[#199119]Unlimited Armament Works[]
block.biomechazard-strikeforce.details = Le Strikeforce est un canon à projectiles terrifiant, interdit dans de nombreux pays pour des raisons de crimes de guerre que provoque sa capacité à déchaîner une salve dévastatrice de composés thermiques de tous types en une quantité effrayante. \n\nHeureusement, ces lois ne s'appliqueront ni là où vous utiliserez cette arme, ni contre qui vous l'utiliserez.
## Railguns - Sniper [RG]
block.biomechazard-ashlock.name = Ashlock
block.biomechazard-ashlock.description = Lente, précise et puissante. Une tourelle de gros calibre et de haute précision qui cible l'ennemi ayant le plus de points de vie.\n[#199119]Unlimited Armament Works[]
block.biomechazard-ashlock.details = Arme puissante à moyenne et longue portée, d'une très grande précision compte tenu de sa taille compacte.
block.biomechazard-longbow.name = Longsword
block.biomechazard-longbow.description = Un canon à tir rapide d'une précision remarquable, tirant des projectiles à grande vitesse sur de vastes distances.\n[#199119]Unlimited Armament Works[]
block.biomechazard-longbow.details = Elle doit son nom à sa forme d'épée. La Longsword est une version améliorée des tourelles de type « Ashlock ». Grâce à l'utilisation de matériaux nouveaux et nettement supérieurs, la Longsword est une arme très fiable dans de nombreuses situations.
block.biomechazard-deadeye.name = Deadeye
block.biomechazard-deadeye.description = Une tourelle à longue portée d'une précision redoutable, capable de tirer des projectiles à une vitesse extrême. \nElle peut détruire la plupart des cibles terrestres en un seul tir.\n[#199119]Unlimited Armament Works[]
block.biomechazard-deadeye.details = Basée sur la tourelle de type « Longsword », elle bénéficie de nombreuses améliorations, notamment un canon à charge magnétique de pointe qui accélère son projectile à une vitesse effrayante.\n\nSprite par Flin
## Artillery [ART]
block.biomechazard-zounderkite.name = Zounderkite
block.biomechazard-zounderkite.description = Lance des conteneurs de mines qui explosent en plein vol et déploie différents types de mines terrestres.\n[#199119]Unlimited Armament Works[]
block.biomechazard-zounderkite.details = Le système de déploiement de mines tactiques, communément appelé S.D.M.T « Zounderkite », est capable de transformer un champ de bataille vide en un champ de mines saturé en quelques minutes. \n\nInterdit dans plusieurs endroits en raison de son caractère non sélectif.
block.biomechazard-skyhammer.name = Skyhammer
block.biomechazard-skyhammer.description = Tire un obus d'artillerie énorme et très lourd sur des cibles situées à une très grande distance. \n\n[accent]Provoque de multiples répliques sismiques dans la zone touchée.[]\n[#199119]Unlimited Armament Works[]
block.biomechazard-skyhammer.details = « Le tonnerre gronde dans le ciel clair. » \n« Lentement, un sifflement strident se fait plus fort, les nuages se brisent, puis la mort nous accueille. »
## Energy [EN]
block.biomechazard-heavylight.name = Heavylight
block.biomechazard-heavylight.description = Arme à faisceau de moyenne portée et à cadence de tir élevée. Peut toucher les ennemis aériens.\n[#199119]Unlimited Armament Works[]
block.biomechazard-heavylight.details = Tourelle énergétique d'entrée de gamme. Comme la plupart des tourelles de ce type, elle est difficile à contrer car elle ignore les boucliers anti-projectiles cinétiques.\n\nLorsque les balles se révèlent inefficaces, les scientifiques les plus brillants se mettent en quête d'une solution ; la « Heavylight » est le fruit d'années de recherches méticuleuses.
block.biomechazard-reticence.name = Reticence
block.biomechazard-reticence.description = Décharge de puissantes sphères d'énergie qui neutralisent temporairement les unités ennemies à l'impact.\n[#199119]Unlimited Armament Works[]
block.biomechazard-reticence.details = La sphère d'énergie de la Reticence inflige rarement des dégâts physiques. Son temps de chargement important la rend lente à tirer, mais elle peut neutraliser rapidement les adversaires les plus redoutables lorsqu'elle est utilisée à bon escient.
block.biomechazard-trailblazer.name = Trailblazer
block.biomechazard-trailblazer.description = Décharge rapidement des projectiles à haute vélocité qui libèrent des arcs électriques à l'impact.\n[#199119]Unlimited Armament Works[]
block.biomechazard-trailblazer.details = La «Trailblazer» utilise une technologie relativement nouvelle. Elle surcharge les munitions classiques pour déclencher un arc électrique à haute tension qui se propage à de nombreuses cibles à l'impact.\n\nElle peut ne pas infliger beaucoup de dégâts à une cible lourdement blindée, mais elle pulvérisera l'ennemi non blindé situé à proximité ou derrière le point d'impact initial.
block.biomechazard-sundouser.name = Sundouser
block.biomechazard-sundouser.description = Déchaîne une sphère d'énergie lente, brûlante et puissante qui anéantira même l'opposition la plus redoutable au contact.\n[#199119]Unlimited Armament Works[]
block.biomechazard-sundouser.details = Lente et difficile à déployer, elle s'avère même être un inconvénient à l'usage, car sa mise en marche consomme une quantité d'énergie colossale. Une fois chargé, elle peut même obscurcir le soleil.
# Defense
block.biomechazard-force-wall.name = Mur à Champ de Force
block.biomechazard-force-wall.description = Un petit mur capable de générer un bouclier lorsqu'il est alimenté.\n[#199119]Unlimited Armament Works[]
block.biomechazard-force-wall.details = Ils se branchent les uns sur les autres, vous n'avez pas besoin de les connecter individuellement à un Transmetteur Énergétique.
block.biomechazard-stoutsteel-wall.name = Mur d'Acier Robuste
block.biomechazard-stoutsteel-wall.description = Protège les structures contre les projectiles ennemis. Résistant aux dégâts d'écrasement.\n[#199119]Unlimited Armament Works[]
block.biomechazard-stoutsteel-wall-large.name = Grand Mur d'Acier Robuste
block.biomechazard-stoutsteel-wall-large.description = Protège les structures contre les projectiles ennemis. Résistant aux dégâts d'écrasement.\n[#199119]Unlimited Armament Works[]
block.biomechazard-rejuvination-projector.name = Projecteur Rajeunissant
block.biomechazard-rejuvination-projector.description = Répare rapidement les bâtiments à proximité et augmente également leur vitesse une fois que leur santé a atteint un certain pourcentage.\n[#199119]Unlimited Armament Works[]
block.biomechazard-rejuvination-dome.name = Dôme Rajeunissant
block.biomechazard-rejuvination-dome.description = Répare rapidement les bâtiments à proximité et augmente également leur vitesse une fois que leur santé a atteint un certain pourcentage.\n[#199119]Unlimited Armament Works[]
# Unit Blocks
block.biomechazard-air-ground-factory.name = War Facility
block.biomechazard-air-ground-factory.description = Produces air and ground vehicle. Output units can be used directly, or moved into reconstructors for upgrading.\n[#199119]Unlimited Armament Works[]
block.biomechazard-air-ground-factory.details = After the Heavens Fall, the world we once knew no longer the same. Peace and prosperity has taken a certain method of payment, which is blood and oil.
block.biomechazard-naval-factory.name = Naval Yard
block.biomechazard-naval-factory.description = Produces naval vessels. Output units can be used directly, or moved into reconstructors for upgrading.\n[#199119]Unlimited Armament Works[]
block.biomechazard-naval-factory.details = Heavens Fall reveals new land while drowning others, while humanity had tamed the vast ocean centuries ago, in this new age it will not be so different.
block.biomechazard-drone-factory.name = Automaton Assembly Yard
block.biomechazard-drone-factory.description = Produces various automatons to assists in construction, logistics, or supports.\n[#199119]Unlimited Armament Works[]
block.biomechazard-drone-factory.details = What couldn't be done by flesh, steel takes over.
block.biomechazard-exponential-petroleum-reconstructor.name = Exponential Petroleum Reconstructor
block.biomechazard-exponential-petroleum-reconstructor.description = Upgrades Terran Tier 3 units into Tier 4.\n[accent]Can be deployed on[] [blue]water[].\n[#199119]Unlimited Armament Works[]
block.biomechazard-tetrative-petroleum-reconstructor.name = Tetrative Petroleum Reconstructor
block.biomechazard-tetrative-petroleum-reconstructor.description = Upgrades Terran Tier 4 units into Tier 5.\n[accent]Can be deployed on[] [blue]water[].\n[#199119]Unlimited Armament Works[]
block.biomechazard-pentative-petroleum-reconstructor.name = Pentative Petroleum Reconstructor
block.biomechazard-pentative-petroleum-reconstructor.description = Upgrades Terran Tier 5 units into Tier 6.\n[accent]Can be deployed on[] [blue]water[].\n[#199119]Unlimited Armament Works[]
## Air - Attack Helicopter
unit.biomechazard-crotchety.name = Crotchety
unit.biomechazard-crotchety.description = Small helicopter carrying a disproportionally large gun firing cryogenic shots for close ground support.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-crotchety.details = Sluggish and flimsy, one would wonder who had the brilliant idea to put such a large gun on this thing.
unit.biomechazard-aglovale.name = Aglovale
unit.biomechazard-aglovale.description = Fast attack helicopter, strafes enemy with a barrage of machine guns shot and rockets.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-aglovale.details = Legacy of the old world, when piston engines and petroleum ruled the heavens.
unit.biomechazard-bedivere.name = Bedivere
unit.biomechazard-bedivere.description = Strafes enemy unit, its rotor will brutally lacerates enemy unit that get close.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-bedivere.details = Its rotor blades were made with a special composite alloy and complimented with a unique manufacturing process where the blades are forged, giving it a very sword-like appearance and functionality.
unit.biomechazard-calogrenant.name = Calogrenant
unit.biomechazard-calogrenant.description = Moderately armoured and armed to the teeth, it rains down annihilation from above.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-calogrenant.details = The standard attack helicopter for Albion Royal Air Force, its armaments delivers Her Eternal Majesty wrath.
unit.biomechazard-dagonet.name = Dagonet
unit.biomechazard-dagonet.description = Unleashes armour-piercing incendiary shots with unparalleled ferocity, along with an immense swarm of unrelenting missiles to ensures not even ashes would remain.\n\nDue to the amount of firepower it carries, its rotor causes intense downdraft that pushes nearby enemies.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-dagonet.details = The menace of the skies, conqueror of the heavens, and the pinnacle of Albion engineering.
unit.biomechazard-esclabor.name = Esclabor
unit.biomechazard-esclabor.description = Unleashes indiscriminate judgement upon your enemy.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-esclabor.details = Forceful, relentless and unbreakable. Designed to withstand and overturn even the most overwhelming opposition.
## Air - Airships & Carriers
unit.biomechazard-cantankerous.name = Cantankerous
unit.biomechazard-cantankerous.description = Medium-sized and somewhat armoured airship. It fires cryogenic projectiles in a short 2-round burst.\n\nAdditionally, it launches cruise missiles armed with a cryogenic warhead.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-cantankerous.details = It is once the pride of Albion engineers, the ex-ruler of the new skies, quickly becoming obsolete once warfare evolves.
unit.biomechazard-illustrious.name = Illustrious
unit.biomechazard-illustrious.description = Constructs and launches self-detonating gyrocopter drones. It has several machine guns to fend for itself.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-illustrious.details = Illustrious-class flying carriers, constructed in haste after the obsolescence of the Cantankerous airships. \n\nIts invention was based on the thought that mounting a large gun on a flying airship was an awful idea, and instead, its hulls loaded with gyrocopter drones that were made out of cryogenic compounds. \n\nOne would wonder about the thought process of its engineer that leads to this.
unit.biomechazard-indefatigable.name = Indefatigable
unit.biomechazard-indefatigable.description = Constructs and launches a series of autonomous aerial drones that fire bullets relentlessly. Has several machine guns and point defence weapons to fend for itself.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-indefatigable.details = The Indefatigable-class flying carrier was born after the terrible and expensive result of the Illustrious-class flying carrier, boasting thicker armour plating, stronger rotor shafts, and gyrocopter drones that shoot instead of crashing themselves to enemies.
unit.biomechazard-indomitable.name = Indomitable
unit.biomechazard-indomitable.description = A flying warship capable of unleashing perpetual winter on the battlefield and also constructs autonomous gyrocopters that support nearby units.\n[#199119]Unlimited Armament Works[]
## Air - Jets
unit.biomechazard-corsair.name = Corsair
unit.biomechazard-corsair.description = Launches laser-guided bombs at targets that deal more damage to buildings.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-corsair.details = Designated as Corsair FB.15, it is a high-performance fighter bomber suited for destroying ground targets, though it can perform as an aerial superiority fighter if needed.
unit.biomechazard-vindicator.name = Vindicator
unit.biomechazard-vindicator.description = Launches laser guided bomb that causes repeating aftershocks in its affected area.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-vindicator.details = The Vindicator FB.30 flies faster and higher than its previous iteration. It is difficult to intercept without proper air defences.
unit.biomechazard-superfortress.name = Superfortress
unit.biomechazard-superfortress.description = Performs devastating bombing run over its target.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-superfortress.details = The Superfortress B(I).45 is a highly durable aircraft. Its engine can lift payloads much heavier than its weight, though it is sluggish compared to its predecessor.
unit.biomechazard-stratofortress.name = Stratofortress
unit.biomechazard-stratofortress.description = Drops devastating bombs at ground target.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-stratofortress.details = An upgrade to Superfortress B(I).45, designated as Stratofortress B(I).90, is a long-range bomber that can fly terrifyingly fast despite its enormous size and weight.
## Naval - Monitor Warship
unit.biomechazard-arquebus.name = Arquebus
unit.biomechazard-arquebus.description = Small, and sluggish. Carries twin artillery that deals more damage against buildings.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-carronade.name = Carronade
unit.biomechazard-carronade.description = Fires a salvo of shells at enemy defences.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-falconet.name = Falconet
unit.biomechazard-falconet.description = Armed with more point defence weapon along with even more devastating artillery.\n\nThe main artillery causes [white]repeating aftershocks[] in its affected area, [white]denying any building to be built[] while its still in effect.\n[#199119]Unlimited Armament Works[]
## Naval - Torpedo Destroyers
unit.biomechazard-megaera.name = Megaera
unit.biomechazard-megaera.description = Swift and formidable, armed with point defence gun and a single torpedo tubes.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-alecto.name = Alecto
unit.biomechazard-alecto.description = Equipped with machine guns, missile launcher, and double forward-facing torpedo launcher.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-tisiphone.name = Tisiphone
unit.biomechazard-tisiphone.description = Nimble yet moderately armoured, launches very powerful torpedoes and anti-ship cruise missiles.\n[#199119]Unlimited Armament Works[]
## Ground - Main Battle Tanks
unit.biomechazard-cavalier.name = Cavalier
unit.biomechazard-cavalier.description = Fires high-explosive shells and a barrage of bullets at targets.\n\nSuffer less movement penalty on liquid and muddy terrain.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-centurion.name = Centurion
unit.biomechazard-centurion.description = Fires armor-piercing shells, launches missiles, and barrages of bullets at target.\n\nSuffer less movement penalty on liquid and muddy terrain.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-caernarvon.name = Caernarvon
unit.biomechazard-caernarvon.description = Fires powerful armour-piercing composite 'dart' at targets that ignores armour and pierces through force shields, also launches missiles and barrages enemy with bullets.\n\nHas a very thick composite armour, rendering most incoming shots ineffective.\n\nSuffer less movement penalty on liquid and muddy terrain.\n[#199119]Unlimited Armament Works[]
## Ground - Flamethrower Tanks
unit.biomechazard-cavalierF.name = Cavalier Pyrite
unit.biomechazard-cavalierF.description = Équipé d'un petit lance-flammes et d'un canon principal tirant des salves incendiaires à courte portée.\n[#199119]Unlimited Armament Works[]
