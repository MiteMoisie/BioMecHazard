### mod "Fading Revelations"

item.biomechazard-gold.name = Or
item.biomechazard-gold.description = Un morceau de métal brillant ! Peut être échangé contre d'autres ressources.
item.biomechazard-steel-alloy.name = Amalgame d'Acier
item.biomechazard-steel-alloy.description = Un matériau composite composé de Cuivre, d'Acier Vivant et d'Alliage Superchargé.
item.biomechazard-uranium-rod.name = Barre d'Uranium
item.biomechazard-uranium-rod.description = Une barre faite d'Uranium.
item.biomechazard-living-steel.name = Acier Vivant
item.biomechazard-living-steel.description = Un morceau de métal vivant. Du titane imprégné de spores.
item.biomechazard-living-steel.details = Dans un petit secteur de Cerbero, un virus a été confiné par le ministère de la Défense. \nCe virus était composé de spores intelligentes. \nDes scientifiques avaient mené des expériences et découvert que ces spores pouvaient modifier des circuits électriques afin de contrôler le fonctionnement des machines à leur guise. \n\nAprès l'invention du 'Noyau Principal', ces spores ont été infusées dans de l'acier, dans l'espoir d'exploiter leur puissance tout en éliminant les risques. \nOn a découvert par la suite que l'acier ainsi imprégné pouvait se multiplier de lui-même. \n\nMais est-ce vraiment le cas ou l'infusion confère-t-elle simplement plus de puissance aux spores ? \nSeul l'avenir nous le dira...
item.biomechazard-living-steel-hard.name = Acier Vivant Trempé
item.biomechazard-living-steel-hard.description = Acier vivant imprégné de thorium pour le rendre plus durable.
item.biomechazard-cryogenic-alloy.name = Alliage Cryogénique
item.biomechazard-cryogenic-alloy.description = Matériau refroidi par choc thermique, composé d'Alliage Igné, de Gel Cryogénique et de Fluide Neutronique. Est extrêmement durable et chargé.
item.biomechazard-cryogenic-gel.name = Gel Cryogénique
item.biomechazard-cryogenic-gel.description = Un matériau extrêmement froid, obtenu en mélangeant du Liquide Cryogénique et du Silicium. Il est utilisé comme un des composants pour créer de l'[cyan]Alliage Cryogénique.
item.biomechazard-igneous-alloy.name = Alliage Igné
item.biomechazard-igneous-alloy.description = Matériau très chaud obtenu par fusion d'Alliage Superchargé et de Titane à l'aide de Scories. Utilisé comme composant nécessaire à la création de l'[cyan]Alliage Cryogénique.

item.biomechazard-ammo-level-1.name = Munition Cuivre
item.biomechazard-ammo-level-1.description = Une munition simple et ennuyeuse, sans aucun effet.
item.biomechazard-ammo-level-2.name = Munition Titane
item.biomechazard-ammo-level-2.description = Munition fabriquée à partir de Titane. Inflige des dégâts corrects et a un effet perforant.
item.biomechazard-ammo-level-3.name = Munition Explosive
item.biomechazard-ammo-level-3.description = Munition fabriquée à partir de Mélange Explosif. Inflige des dégâts corrects et a un effet de fragmentation sur certaines tourelles.
item.biomechazard-heal-ammo.name = Munition Soignante
item.biomechazard-heal-ammo.description = Munition fabriquée à partir de capsules de Spore. N'inflige aucun dégât, mais soigne les blocs alliés touchés.
item.biomechazard-homing-ammo.name = Munition à Tête Chercheuse
item.biomechazard-homing-ammo.description = Munition fabriquée à partir de Thorium. Dégâts importants et à tête chercheuse.
item.biomechazard-nano-ammo.name = Munition Nano
item.biomechazard-nano-ammo.description = Munition fabriquée à partir d'Acier Vivant qui infecte les ennemis avec des nanorobots qui les brûlent de l'intérieur.
item.biomechazard-nuke.name = Arme Nucléaire
item.biomechazard-nuke.description = Une ogive nucléaire fabriquée avec du Graphite et des Barres d'Uranium.

liquid.biomechazard-acid.name = Acide
liquid.biomechazard-acid.description = Un liquide dangereux.
liquid.biomechazard-living-steel-liquid.name = Acier Vivant Liquéfié
liquid.biomechazard-living-steel-liquid.description = Acier Vivant imprégné de Pétrole, ce qui le liquéfie. Se propage au Pétrole environnant pour s'"auto-répliquer".
liquid.biomechazard-neutron-fluid.name = Fluide Neutronique
liquid.biomechazard-neutron-fluid.description = Un liquide de refroidissement très puissant, obtenu en mélangeant du Pétrole, du Liquide Cryogénique et de l'Acier Vivant Liquéfié.
liquid.biomechazard-water-vapor.name = Eau Vaporisée
liquid.biomechazard-water-vapor.description = Eau ayant subie une évaporation.

