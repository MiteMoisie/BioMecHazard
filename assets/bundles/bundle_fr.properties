## Automatons - Construction & Resource Gathering
unit.biomechazard-pellinore.name = Pellinore
unit.biomechazard-pellinore.description = Automate minier aérien de taille moyenne, doté de grands espaces de stockage pour transporter des matériaux précieux. Cependant, il est incapable de se défendre et est assez fragile.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-percival.name = Percival
unit.biomechazard-percival.description = Grand automate minier aérien, capable de stocker une très grande quantité de matériaux avant de les déverser.\n[#199119]Unlimited Armament Works[]
## Automatons - Support
unit.biomechazard-tailwind.name = Tailwind
unit.biomechazard-tailwind.description = Augmente la vitesse de déplacement et de tir des alliés proches.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-cleric.name = Cleric
unit.biomechazard-cleric-description = Soigne les alliés proches.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-bulwark.name = Bulwark
unit.biomechazard-bulwark.description = Protège les alliés proches grâce à son bouclier régénérateur.\n[#199119]Unlimited Armament Works[]

