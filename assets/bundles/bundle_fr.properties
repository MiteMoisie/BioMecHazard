liquid.biomechazard-phlogiston.name = Phlogiston
liquid.biomechazard-phlogiston.description = Substance volatile et hautement combustible, utilisée pour alimenter les infrastructures à base de Phlogiston, ainsi que pour synthétiser des matériaux.\n[#199119]Unlimited Armament Works[]
liquid.biomechazard-phlogiston.details = Substance découverte à la suite de la Chute des Cieux, le Phlogiston reste à ce jour un élément mystérieux, malgré son utilisation omniprésente.
