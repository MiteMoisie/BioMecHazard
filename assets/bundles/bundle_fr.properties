### mod "Unlimited Armament Works"

item.biomechazard-cryogel.name = Cryogel
item.biomechazard-cryogel.description = Objet gélatineux froid. Utilisé comme munition thermique et agent réfrigérant.
item.biomechazard-cryogel.details = Un composé extrêmement froid obtenu par mélange de liquide cryogénique et de sable, présentant une consistance gélatineuse malgré sa basse température.\n\nIl est fortement déconseillé d'en consommer, malgré son goût rappelant la gelée de menthe.

item.biomechazard-anthracite.name = Anthracite
item.biomechazard-anthracite.description = Utilisé pour la synthèse de carburant et de matériaux avancés. On le trouve profondément sous les veines de charbon.
item.biomechazard-anthracite.details = Également appelé charbon dur, il s'agit d'un charbon dur et compact présentant un éclat submétallique. \n\nDe tous les types de charbon, il possède la plus forte teneur en carbone, la plus faible teneur en impuretés et la plus haute densité énergétique.

item.biomechazard-stoutsteel.name = Acier Allié Robuste
item.biomechazard-stoutsteel.description = Un alliage exceptionnellement durable utilisé dans la construction de véhicules, les structures de défense, la fabrication de munitions et l'installation de canalisations.
item.biomechazard-stoutsteel.details = Officiellement connu sous le nom 'Alliage de Sheffield', c'était un alliage dont, malheureusement, la plupart des connaissances sur son processus de fabrication ont été perdues à cause de la Chute des Cieux.\n\nCe que vous avez ici ne pourra jamais égaler l'original.

item.biomechazard-sulphur.name = Soufre
item.biomechazard-sulphur.description = Sous-produit du raffinage du Phlogiston. Utilisé dans les structures de défense.
