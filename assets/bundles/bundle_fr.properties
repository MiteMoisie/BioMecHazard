block.biomechazard-core-nethrax.name = [#7665C9]Noyau : Nethrax
block.biomechazard-core-nethrax.description = [#A865C9]Le cœur de votre base. Ce noyau est énormément blindé pour sa taille et peut stocker des quantités gigantesques de ressources et de liquides.\n[#2E00A1]Technologie Développée[]
block.biomechazard-core-nethrax.details = Conçu pour survivre aux conditions les plus extrêmes des planètes les plus dangereuses, cette version du noyau est la plus évoluée possible... jusqu'à la suivante.
block.biomechazard-core-nexus.name = [#324C9C]Noyau : Nexus
block.biomechazard-core-nexus.description = [#6572C9]Le cœur de votre base. Incroyablement bien blindé. Stocke des quantités énormes de ressources.\n[#132A70]Technologie Assimilée[]
block.biomechazard-core-nexus.details = Quatrième génération expérimentale. Origine des données inconnue.
block.biomechazard-core-network.name = [#324C9C]Noyau : Réseau
block.biomechazard-core-network.description = [#6572C9]Le cœur de votre base. Absurdement bien blindé. Stocke de vastes quantités de ressources.\n[#132A70]Technologie Assimilée[]
block.biomechazard-core-network.details = Prototype de cinquième génération. 
block.biomechazard-enhanced-container.name = [#7665C9]Conteneur Amélioré
block.biomechazard-enhanced-container.description = [#A865C9]Stocke un petit nombre d'objets de chaque type. Utilisez un déchargeur pour les récupérer. Augmente la capacité de stockage d'un Noyau adjacent.\nStocke une quantité non-négligeable de fluide. Sort de tous les côtés, de la même manière qu'un routeur de liquide.\nUtile pour réguler les flux d'objets et de fluides quand la demande est inconstante ou comme sécurité pour refroidir des bâtiments importants.\nPeut transmettre l'énergie à n'importe quel bâtiment adjacent comme un Transmetteur Énergétique.\n[#2E00A1]Technologie Développée[]
block.biomechazard-enhanced-container.details = 
