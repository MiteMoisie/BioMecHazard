block.biomechazard-gate-uaw-start.name = Le Commencement
block.biomechazard-gate-uaw-start.description = Fumée et Tonnerre, Cordite et Acier\n\nBienvenue à Unlimited Armament Works\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret.name = Tourelles
block.biomechazard-gate-uaw-turret.description = Du grondement tonitruant des mitrailleuses à la puissance dévastatrice des canons à courte portée et à la précision de l'artillerie, ces armes redoutables constituent le socle des défenses, infligeant une vengeance rapide et sévère à quiconque ose entrer sans y être autorisé.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-mg.name = Mitrailleuses
block.biomechazard-gate-uaw-turret-mg.description = Un armement semblable à un brasier vengeur, où les puissants sont réduits à l'impuissance.\n\nAvec un barrage à tir rapide couvrant de vastes distances, cette merveille d'ingénierie règle les choses par la quantité plutôt que par la précision.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-sg.name = Cannons à tir dispersif
block.biomechazard-gate-uaw-turret-sg.description = Contemplez la symphonie tonitruante de la dévastation, où chaque explosion disperse les adversaires comme la paille au vent. Ces formidables arsenaux incarnent une fureur indomptée, semant la terreur dans le cœur de tous ceux qui osent s'approcher suffisamment près de leur domaine.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-art.name = Artilleries
block.biomechazard-gate-uaw-turret-art.description = Majestueux colosses de guerre, façonnés avec un art méticuleux et dotés d'une puissance terrifiante. Ces colosses de destruction déchaînent leur haine avec des charges mortelles sur des royaumes lointains, effaçant tout ce qui a le malheur de se trouver sur leur chemin.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-msl.name = Lanceurs de missiles
block.biomechazard-gate-uaw-turret-msl.description = Les javelots et les lances du royaume céleste, projetant leur jugement dans des projectiles aériens guidés.\n\nChargés de justice, ils transportent le poids de la rétribution divine sur ceux qui se trouvent sur leur chemin prédestiné.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-en.name = Armes à Énergie
block.biomechazard-gate-uaw-turret-en.description = \n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-crafting.name = Fabrication
block.biomechazard-gate-uaw-crafting.description = \n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-defence.name = Défenses
