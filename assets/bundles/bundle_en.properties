block.biomechazard-gate-uaw-start.name = The Beginning
block.biomechazard-gate-uaw-start.description = Smokes and Thunder, Cordite and Steel\n\nWelcome to Unlimited Armament Works\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret.name = Turrets
block.biomechazard-gate-uaw-turret.description = From the thunderous roar of machine guns to the devastating power of shot-cannons and the precision of artilleries, these formidable weapons form the bedrock of defences, delivering swift and severe retribution to any who dare trespass.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-mg.name = Machine Guns
block.biomechazard-gate-uaw-turret-mg.description = Armaments akin to a vengeful blaze, where the mighty are rendered feeble as tow.\n\nWith a rapid-fire barrage spanning vast distances, this engineering marvel settles matters with quantity over precision.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-sg.name = Shot-cannons
block.biomechazard-gate-uaw-turret-sg.description = Behold the thunderous symphony of devastation, where each blast disperses adversaries like chaff in the wind.\n\nThese formidable series of armaments embody untamed fury, striking terror into the hearts of all who dare approach near enough to its domain.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-art.name = Artilleries
block.biomechazard-gate-uaw-turret-art.description = Majestic behemoths of war, crafted with meticulous artistry and endowed with awe-inspiring might.\n\nThese colossi of destruction, unleashes their spite with deadly payloads to distant realms, erasing all that is unfortunate enough to be in the receiving end.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-msl.name = Missile Launchers
block.biomechazard-gate-uaw-turret-msl.description = The javelins and lances of the celestial realm, casting their judgement forth in guided aerial projectiles.\n\n With payloads of righteousness, they carry forth the weight of divine retribution upon those who stand in their destined path.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-en.name = Energy Guns
block.biomechazard-gate-uaw-turret-en.description = \n[#199119]Unlimited Armament Works[]
