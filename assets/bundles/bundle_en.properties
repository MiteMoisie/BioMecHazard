block.biomechazard-core-nethrax.name = [#7665C9]Core : Nethrax
block.biomechazard-core-nethrax.description = [#A865C9]The heart of your base. This core is extremely well-armored for its size and can store enormous quantities of resources and liquids.
block.biomechazard-core-nethrax.details = Designed to survive the most extreme conditions on the most dangerous planets, this version of the core is the most advanced possible... until the next one.
block.biomechazard-enhanced-container.name = [#7665C9]Enhanced Container
block.biomechazard-enhanced-container.description = [#A865C9]Stores a small number of items of each type. Use a unloader to retrieve them. Increases the storage capacity of an adjacent Core.\nStores a significant amount of fluid. Dispenses from all sides, similar to a liquid router. Useful for regulating the flow of items and fluids when demand is inconsistent or as a backup for cooling large buildings. Can transmit power to any adjacent building like a Power Transmitter.
block.biomechazard-enhanced-container.details = 
block.biomechazard-enhanced-vault.name = [#7665C9]Enhanced Vault
block.biomechazard-enhanced-vault.description = [#A865C9]Stores a large number of items of each type. Use a unloader to retrieve them. Increases the storage capacity of an adjacent Core.\nStores a large amount of fluid. Outputs from all sides, similar to a liquid router.\nUseful for regulating the flow of objects and fluids when demand is inconsistent or as a backup for cooling large buildings.\nCan transmit energy to any adjacent building like an Energy Transmitter.
block.biomechazard-enhanced-vault.details = 
block.biomechazard-warehouse.name = [#7665C9]Warehouse
block.biomechazard-warehouse.description = [#A865C9]Stores a very large number of objects of each type. Use an unloader to retrieve them. Increases the storage capacity of an adjacent Core.\nStores a very large quantity of fluid. Outputs from all sides, similar to a liquid router.\nUseful for regulating the flow of objects and fluids when demand is inconsistent or as a backup for cooling large buildings.\nCan transmit energy to any adjacent building like an Energy Transmitter.
block.biomechazard-warehouse.details = 
block.biomechazard-large-warehouse.name = [#7665C9]Large Warehouse
block.biomechazard-large-warehouse.description = [#A865C9]Stores a huge number of objects of each type. Use an unloader to retrieve them. Increases the storage capacity of an adjacent Core. Stores a massive amount of fluid. Dispenses from all sides, similar to a liquid router. Useful for regulating the flow of objects and fluids when demand is inconsistent or as a safety measure for cooling large buildings.\nCan transmit energy to any adjacent building like an Energy Transmitter.
block.biomechazard-large-warehouse.details = 
block.biomechazard-enhanced-unloader.name = [#7665C9]Enhanced Unloader
block.biomechazard-enhanced-unloader.description = [#A865C9]Allows the selected object to be discharged to adjacent blocks in greater quantities.\nCan transmit energy to any adjacent building like an Energy Transmitter.
block.biomechazard-enhanced-unloader.details = 
