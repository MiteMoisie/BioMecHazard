block.biomechazard-gate-quarkhod.name = [#7665C9]Portail technologique : Quarkhod
block.biomechazard-gate-quarkhod.description = [#A865C9]Le savoir, c'est le pouvoir. Toutes les technologies des Quarkhods qui font de cette race l'une des plus évoluées de l'univers se trouvent ici.
block.biomechazard-gate-quarkhod.details = Découvrir. Apprendre. Évoluer. Se propager. Encore. Toujours. \n\nC'est par ces principes que les Quarkhods sont passés d'un simple organisme viral d'une planète extrêmement hostile à une race biomécanique voyageant à travers l'univers. \nQue ce soit organique, minéral ou mécanique, ils assimilent toutes les connaissances qu'ils trouvent, détenant même des secrets technologiques de races aujourd'hui disparues.
block.biomechazard-gate-sector.name = [#7665C9]Portail technologique : Secteurs
block.biomechazard-gate-sector.description = [#A865C9]Différents mondes, nouvelles connaissances à découvrir.
block.biomechazard-gate-core.name = [#7665C9]Portail technologique : Noyaux
block.biomechazard-gate-core.description = [#A865C9]Les bases centrales des colonies Quarkhod.
block.biomechazard-gate-core-unit.name = [#7665C9]Portail technologique : Unités de noyau
block.biomechazard-gate-core-unit.description = [#A865C9]Les unités de commandement des colonies Quarkhod, toujours envoyées en premier avec leur noyau respectif.
block.biomechazard-gate-item.name = [#7665C9]Portail technologique : Objets
block.biomechazard-gate-item.description = [#A865C9]Les données scientifiques des ressources rencontrées ou crées, qu'elles soient naturelles ou artificielles.
block.biomechazard-gate-drill.name = [#7665C9]Portail technologique : Récolteurs d'objets
block.biomechazard-gate-drill.description = [#A865C9]Tous les outils pour obtenir les ressources de base à l'expension des colonies.
block.biomechazard-gate-distribution.name = [#7665C9]Portail technologique : Distributions d'objets
block.biomechazard-gate-distribution.description = [#A865C9]...
block.biomechazard-gate-duct.name = [#7665C9]Portail technologique : Conduits de fluides
block.biomechazard-gate-duct.description = [#A865C9]...
block.biomechazard-gate-crafting.name = [#7665C9]Portail technologique : Usines de fabrication
block.biomechazard-gate-crafting.description = [#A865C9]Ce que les mondes ne produisent pas, les Quarkhods le fabrique.
block.biomechazard-gate-power.name = [#7665C9]Portail technologique : Génération d'énergie
block.biomechazard-gate-power.description = [#A865C9]Pour alimenter les colonies les plus complexes, les Quarkhods sont passés maitres dans l'art de récupérer, produire ou transformer l'énergie
block.biomechazard-gate-util.name = [#7665C9]Portail technologique : Utilitaires
block.biomechazard-gate-util.description = [#A865C9]Pour les Quarkhods même les technologiques exotiques peuvent avoir une utilité.
block.biomechazard-gate-logic.name = [#7665C9]Portail technologique : Systèmes logiques
block.biomechazard-gate-logic.description = [#A865C9] En assimilant les technologies numériques, les Quarkhods sont devenues une race biomécanique à part entière.
block.biomechazard-gate-wall.name = [#7665C9]Portail technologique : Murs
block.biomechazard-gate-wall.description = [#A865C9] Pour protéger leur bien le plus précieux, les Quarkhods ont développé des protections parmi les plus complexes et efficaces.
block.biomechazard-gate-turret.name = [#7665C9]Portail technologique : Tours de défense
block.biomechazard-gate-turret.description = [#A865C9]Quand la dissuasion ne suffit pas, défendre devient synonyme de détruire.
block.biomechazard-gate-unit-factory.name = [#7665C9]Portail technologique : Usines de fabrication d'unités
block.biomechazard-gate-unit-factory.description = [#A865C9]Quelques fois, la meilleure défense est l'attaque.
block.biomechazard-gate-ground-unit.name = [#7665C9]Portail technologique : Unités terrestres
block.biomechazard-gate-ground-unit.description = [#A865C9]Pour s'assurer la maitrise d'une planète, avoir les pieds (ou les pattes) sur terre est un prérequis.
block.biomechazard-gate-air-unit.name = [#7665C9]Portail technologique : Unités aériennes
block.biomechazard-gate-air-unit.description = [#A865C9]Savoir marcher, c'est bien mais savoir voler ouvre littéralement de nouveaux cieux.
block.biomechazard-gate-naval-unit.name = [#7665C9]Portail technologique : Unités navales
block.biomechazard-gate-naval-unit.description = [#A865C9]Aucun environnement est hors de portée pour les Quarkhods
