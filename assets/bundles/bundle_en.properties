### mod "Unlimited Armament Works"

item.biomechazard-cryogel.name = Cryogel
item.biomechazard-cryogel.description = A cold, gelatinous object. Used as thermal munitions and cooling agent.\n[#199119]Unlimited Armament Works[]
item.biomechazard-cryogel.details = An exceedingly frigid compound obtained through the amalgamation of cryofluid and sand, displaying a gelatinous nature despite its low temperature.\n\nIt is implored to abstain from its consumption despite it is reminiscence of the flavor of mint jelly.

item.biomechazard-anthracite.name = Anthracite
item.biomechazard-anthracite.description = Used for fuel and advanced material synthesizing. Can be found deep beneath coal veins.\n[#199119]Unlimited Armament Works[]
item.biomechazard-anthracite.details = Also referred to as hard coal, it is a hard, compact style of coal that encompasses a sub-metallic lustre. \n\nIt has the most carbon content, the fewest impurities, and the highest energy density of every type of coal.

item.biomechazard-stoutsteel.name = Stoutsteel Alloy
item.biomechazard-stoutsteel.description = An exceptionally durable alloy used in vehicle construction, defence structures, munitions manufacturing, and piping installation.\n[#199119]Unlimited Armament Works[]
item.biomechazard-stoutsteel.details = Officially known as 'Sheffield Alloy', it was an alloy that unfortunately had lost most of its manufacturing insights due to The Heavens Fall.\n\nWhat you have here could never hold a candle to the original.

item.biomechazard-sulphur.name = Sulphur
item.biomechazard-sulphur.description = Byproduct of phlogiston refining. Used in defence structures.\n[#199119]Unlimited Armament Works[]
