### mod "Fading Revelations"

item.biomechazard-gold.name = Gold
item.biomechazard-gold.description = A shiny piece of metal! Can be traded to get other resources.\n[#B22222]Fading Revelations[]
item.biomechazard-steel-alloy.name = Steel Amalgam
item.biomechazard-steel-alloy.description = A compound material made from Copper, Living Steel and Surge Alloy.\n[#B22222]Fading Revelations[]
item.biomechazard-uranium-rod.name = Uranium Rod
item.biomechazard-uranium-rod.description = A rod made out of Uranium.\n[#B22222]Fading Revelations[]
item.biomechazard-living-steel.name = Living Steel
item.biomechazard-living-steel.description = A living piece of metal. Titanium infused with spores.\n[#B22222]Fading Revelations[]
item.biomechazard-living-steel.details = In a small sector on Cerbero, a virus was contained by the ministry of defense. \n The virus consisted of intelligent spores. \n Scientists had done experiments and found that the spores had the ability to alter parts of electrical circuits to change the behaviour of maschines to their likings. \n \n After the invention of the 'main core', these spores were infused into steel, hoping that their power could be used while annihilating their risks. \n It was later found that the infused steel could multiply itself. \n \n But is this really the case or does the infusion give the spores more power? \n Only time will tell...
item.biomechazard-living-steel-hard.name = Hardened Living Steel
item.biomechazard-living-steel-hard.description = Living steel that was infused with thorium to make it more durable.\n[#B22222]Fading Revelations[]
item.biomechazard-cryogenic-alloy.name = Cryogenic Alloy
item.biomechazard-cryogenic-alloy.description = A schock-cooled material made from Igneous Alloy, Cryogenic Gel and Neutron Fluid. Is extremely durable and charged.\n[#B22222]Fading Revelations[]
item.biomechazard-cryogenic-gel.name = Cryogenic Gel
item.biomechazard-cryogenic-gel.description = A very cold material made from mixing cryofluid and silicon. Used as one of the components to create [cyan]Cryogenic Alloy.\n[#B22222]Fading Revelations[]
item.biomechazard-igneous-alloy.name = Igneous Alloy
item.biomechazard-igneous-alloy.description = A very hot material smelted from surge alloy and titanium using slag. Used as a component needed to create [cyan]Cryogenic Alloy.\n[#B22222]Fading Revelations[]

item.biomechazard-ammo-level-1.name = Copper Ammo
item.biomechazard-ammo-level-1.description = Simple, boring ammo with absolutly no effects whatsoever.\n[#B22222]Fading Revelations[]
item.biomechazard-ammo-level-2.name = Titanium Ammo
item.biomechazard-ammo-level-2.description = Ammo made from titanium. Decent damage and has pierce.\n[#B22222]Fading Revelations[]
item.biomechazard-ammo-level-3.name = Explosive Ammo
item.biomechazard-ammo-level-3.description = Ammo made from blast compound. Decent damage and has a frag effect in some turrets.\n[#B22222]Fading Revelations[]
item.biomechazard-heal-ammo.name = Healing Ammo
item.biomechazard-heal-ammo.description = Ammo made from spore pods. No damage but heals hit allied blocks.\n[#B22222]Fading Revelations[]
item.biomechazard-homing-ammo.name = Homing Ammo
item.biomechazard-homing-ammo.description = Ammo made from thorium. Good damage and has a homing effect.\n[#B22222]Fading Revelations[]
item.biomechazard-nano-ammo.name = Nano Ammo
item.biomechazard-nano-ammo.description = Ammo made from living steel that infects enemies with nano bots which burn them from the inside.\n[#B22222]Fading Revelations[]
item.biomechazard-nuke.name = Nuke
item.biomechazard-nuke.description = A nuclear warhead made using graphite and uraniumrods.\n[#B22222]Fading Revelations[]

liquid.biomechazard-acid.name = Acid
liquid.biomechazard-acid.description = A dangerous liquid.\n[#B22222]Fading Revelations[]
liquid.biomechazard-living-steel-liquid.name = Living Steel Liquid
liquid.biomechazard-living-steel-liquid.description = Living Steel that was infused with oil thus making it a liquid. Spreads to nearby oil to 'self-replicate'.\n[#B22222]Fading Revelations[]
liquid.biomechazard-neutron-fluid.name = Neutron Fluid
liquid.biomechazard-neutron-fluid.description = A highly potent coolant created by mixing oil, cryofluid and living steel liquid.\n[#B22222]Fading Revelations[]
liquid.biomechazard-water-vapor.name = Water Vapor
liquid.biomechazard-water-vapor.description = Evaporated water.\n[#B22222]Fading Revelations[]

