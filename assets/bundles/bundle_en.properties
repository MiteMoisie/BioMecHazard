block.biomechazard-gate-uaw-start.name = The Beginning
block.biomechazard-gate-uaw-start.description = Smokes and Thunder, Cordite and Steel\n\nWelcome to Unlimited Armament Works\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret.name = Turrets
block.biomechazard-gate-uaw-turret.description = From the thunderous roar of machine guns to the devastating power of shot-cannons and the precision of artilleries, these formidable weapons form the bedrock of defences, delivering swift and severe retribution to any who dare trespass.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-mg.name = Machine Guns
block.biomechazard-gate-uaw-turret-mg.description = Armaments akin to a vengeful blaze, where the mighty are rendered feeble as tow.\n\nWith a rapid-fire barrage spanning vast distances, this engineering marvel settles matters with quantity over precision.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-sg.name = Shot-cannons
block.biomechazard-gate-uaw-turret-sg.description = Behold the thunderous symphony of devastation, where each blast disperses adversaries like chaff in the wind.\n\nThese formidable series of armaments embody untamed fury, striking terror into the hearts of all who dare approach near enough to its domain.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-art.name = Artilleries
block.biomechazard-gate-uaw-turret-art.description = Majestic behemoths of war, crafted with meticulous artistry and endowed with awe-inspiring might.\n\nThese colossi of destruction, unleashes their spite with deadly payloads to distant realms, erasing all that is unfortunate enough to be in the receiving end.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-msl.name = Missile Launchers
block.biomechazard-gate-uaw-turret-msl.description = The javelins and lances of the celestial realm, casting their judgement forth in guided aerial projectiles.\n\n With payloads of righteousness, they carry forth the weight of divine retribution upon those who stand in their destined path.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-turret-en.name = Energy Guns
block.biomechazard-gate-uaw-turret-en.description = \n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-crafting.name = Manufacturing
block.biomechazard-gate-uaw-crafting.description = \n[#199119]Unlimited Armament Works[]
block.biomechazard-gate-uaw-defence.name = Defenses
block.biomechazard-gate-uaw-defence.description = \n[#199119]Unlimited Armament Works[]
# Drills / Material Gathering / Pump
block.biomechazard-oil-derrick.name = Oil Derrick
block.biomechazard-oil-derrick.description = Drills oil from beneath the planet's crust.\n\nRequires steam to operate.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-pump.name = Steam Pump
block.biomechazard-steam-pump.description = Pumps and outputs liquid using high-pressure steam.\n[#199119]Unlimited Armament Works[]
block.biomechazard-pulsometer-pump.name = Pulsometer Pump
block.biomechazard-pulsometer-pump.description = Pumps and outputs lots of liquid using high-pressure steam.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-drill.name = Steam Drill
block.biomechazard-steam-drill.description = A steam-powered drill, capable of mining Titanium ore.\nOil, can be used for lubrication, increasing the efficiency.\n[#199119]Unlimited Armament Works[]
block.biomechazard-advanced-steam-drill.name = Advanced Steam Drill
block.biomechazard-advanced-steam-drill.description = Bigger, faster, and better than a regular Steam Drill, capable of mining much harder material. \nOil can be used for lubrication, increasing the efficiency.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-thumper.name = Steam Thumper
block.biomechazard-steam-thumper.description = Injects high-pressure steam beneath surface coal veins, unearthing a highly potent fuel called anthracite.\n[#199119]Unlimited Armament Works[]
## Heat
block.biomechazard-copper-heat-node.name = Copper Heat Node
block.biomechazard-copper-heat-node.description = Simple heat node made from copper that transfers heat forward.\n[#199119]Unlimited Armament Works[]
block.biomechazard-composite-heat-node.name = Hybrid Heat Node
block.biomechazard-composite-heat-node.description = Durable heat node that transfers power and heat forward. \nCan be deployed on [blue]water[].\n[#199119]Unlimited Armament Works[]
## Liquid
block.biomechazard-pressurized-conduit.name = Stoutsteel Conduit
block.biomechazard-pressurized-conduit.description = Rapidly moves liquid forward, has a very high flow rate and can handle high-temperature liquid. Does not leak.\n\nCan be deployed on [blue]water[]\n[#199119]Unlimited Armament Works[]
block.biomechazard-plated-pressurized-conduit.name = Plated Stoutsteel Conduit
block.biomechazard-plated-pressurized-conduit.description = Rapidly moves liquid forward, has a very high flow rate and can handle high-temperature liquid.\nDoes not accept input from the sides. Does not leak.\n\nCan be deployed on [blue]water[]\n[#199119]Unlimited Armament Works[]
block.biomechazard-pressurized-liquid-router.name = Stoutsteel Liquid Router
block.biomechazard-pressurized-liquid-router.description = Accepts liquids from one direction and outputs them equally to up to 3 other directions. It can keep up with Pressurized Conduit output. Heavily Armoured.\n[#199119]Unlimited Armament Works[]
block.biomechazard-pressurized-liquid-junction.name = Stoutsteel Liquid Junction
block.biomechazard-pressurized-liquid-junction.description = Rapidly moves liquids forward. Used in conjunction with pumps and other conduits. Heavily Armoured.\n[#199119]Unlimited Armament Works[]
block.biomechazard-pressurized-liquid-bridge.name = Stoutsteel Liquid Bridge
block.biomechazard-pressurized-liquid-bridge.description = Transports liquids over terrain or buildings faster and farther than a standard Liquid Bridge. Heavily Armoured.\n[#199119]Unlimited Armament Works[]
## Power
block.biomechazard-petroleum-generator.name = Petroleum Generator
block.biomechazard-petroleum-generator.description = Generate lots of power from burning oil. Explodes when destroyed. \nRequires a bit of power to kickstart the process.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-turbine.name = Steam Turbine
block.biomechazard-steam-turbine.description = Uses steam to generate power. The steam is then condensed back into water.\n[#199119]Unlimited Armament Works[]
block.biomechazard-advanced-steam-turbine.name = Advanced Steam Turbine
block.biomechazard-advanced-steam-turbine.description = Uses steam to generate lots of power. The steam is then condensed back into water.\n[#199119]Unlimited Armament Works[]
## Steam
block.biomechazard-steam-kettle.name = Steam Kettle
block.biomechazard-steam-kettle.description = Boils water to produce steam.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-kettle.details = Small and primitive, it could also be used to make instant noodles.
block.biomechazard-industrial-boiler.name = Industrial Boiler
block.biomechazard-industrial-boiler.description = Generates steam by boiling water with flammable materials.\n[#199119]Unlimited Armament Works[]
block.biomechazard-industrial-boiler.details = A reinforced inner boiler allows this machine to use a variety of flammable materials to operate, assuming they're aren't explosive.
block.biomechazard-pressure-boiler.name = Pressure Boiler
block.biomechazard-pressure-boiler.description = Generates steam significantly more efficient by boiling water with flammable materials.\n[#199119]Unlimited Armament Works[]
block.biomechazard-pressure-boiler.details = Water is heated with intense pressure, allowing it to boils above its boiling temperature.
block.biomechazard-geothermal-boiler.name = Geothermal Boiler
block.biomechazard-geothermal-boiler.description = Generates steam if placed in hot area.\n[#199119]Unlimited Armament Works[]
## Heat
block.biomechazard-vapour-heater.name = Vapour Heater
block.biomechazard-vapour-heater.description = Uses steam to generate heat and water.\n[#199119]Unlimited Armament Works[]
block.biomechazard-coal-burner.name = Coal Burner
block.biomechazard-coal-burner.description = Produces heat by burning coal.\n[#199119]Unlimited Armament Works[]
block.biomechazard-lpg-heater.name = Gas Heater
block.biomechazard-lpg-heater.description = Produces heat by burning petroleum gas.\n[#199119]Unlimited Armament Works[]
# Crafters
block.biomechazard-alloy-crucible.name = Alloy Crucible
block.biomechazard-alloy-crucible.description = Mixes Anthracite dust and other materials to produce an extraordinarily dense and durable alloy known as 'Stoutsteel'.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gelatinizer.name = Cryofluid Gelatinizer
block.biomechazard-gelatinizer.description = Produces Cryogel. A very cold yet gelatinous compound.\n[#199119]Unlimited Armament Works[]
block.biomechazard-gelatinizer.details = By sand, cryoliquid can be gelatinized into cryogel, allowing for more convinient storage and versatile uses.
block.biomechazard-cryofluid-blender.name = Cryofluid Blender
block.biomechazard-cryofluid-blender.description = Rapidly mixes water with fine titanium powder to produce cryofluid.\n[#199119]Unlimited Armament Works[]
block.biomechazard-plastanium-fabricator.name = Plastanium Fabricator
block.biomechazard-plastanium-fabricator.description = Rapidly produces plastanium from oil and titanium.\n[#199119]Unlimited Armament Works[]
block.biomechazard-steam-press.name = Steam Press
block.biomechazard-steam-press.description = Rapidly compresses coal into graphite.\n[#199119]Unlimited Armament Works[]
block.biomechazard-petrochemical-centrifuge.name = Petrochemical Centrifuge
block.biomechazard-petrochemical-centrifuge.description = Transform oil into coal and anthracite.\n[#199119]Unlimited Armament Works[]
block.biomechazard-petrochemical-centrifuge.details = I don't know how this works, at this point just screw realism.
block.biomechazard-petroleum-crucible.name = Petroleum Crucible
block.biomechazard-petroleum-crucible.description = Produces silicon and metaglass at a very high rate using oil as fuel.\n[#199119]Unlimited Armament Works[]
## Machine Guns [MG]
block.biomechazard-quadra.name = Quadra
block.biomechazard-quadra.description = Rapidly fire projectiles from its twin parallel barrels.\n[#199119]Unlimited Armament Works[]
block.biomechazard-quadra.details = Twin reinforced side by side barrel allows the Quadra to sustain high-rate of fire for an extended period of time.
block.biomechazard-spitfire.name = Spitfire
block.biomechazard-spitfire.description = Shoots incredibly fast. Limited to ground target.\n[#199119]Unlimited Armament Works[]
block.biomechazard-spitfire.details = Unleashes streams of projectiles with unrelenting ferocity.
## Shot-cannons [SG]
block.biomechazard-buckshot.name = Buckshot
block.biomechazard-buckshot.description = Short range turret, fires multiple pellets per shot.\n[#199119]Unlimited Armament Works[]
block.biomechazard-buckshot.details = A comically oversized shotgun mounted on a reinforced base with surprising effectiveness despite its age.
block.biomechazard-tempest.name = Tempest
block.biomechazard-tempest.description = High rate of fire, shoot multiple pellets and consumes a lot of ammo.\n\nPrioritizes flying enemies over ground ones.\n[#199119]Unlimited Armament Works[]
block.biomechazard-tempest.details = An automatic shot-cannon in a gatling configuration. What it lacks in firepower, it compensates in efficiency, unleashing a violent storm of projectiles within its range.
block.biomechazard-strikeforce.name = Strikeforce
block.biomechazard-strikeforce.description = Slow rate of fire, absolutely devastating at close range.\n[#199119]Unlimited Armament Works[]
block.biomechazard-strikeforce.details = The Strikeforce is a terrifying shot-cannon banned in numerous countries for war crimes issues that can unleash a mauling spread of numerous types of thermal compounds at a frightening quantity. \n\nFortunately, those laws won't apply where you would use this weapon and to whom you use it anyway.
## Railguns - Sniper [RG]
block.biomechazard-ashlock.name = Ashlock
block.biomechazard-ashlock.description = Slow, accurate, and powerful. A precise, big calibre turret that targets the enemy with the highest health.\n[#199119]Unlimited Armament Works[]
block.biomechazard-ashlock.details = Powerful medium to a long-range gun with very high accuracy given its compact size.
block.biomechazard-longbow.name = Longsword
block.biomechazard-longbow.description = A rapid-firing gun with remarkable accuracy, firing high-velocity projectiles over vast distances.\n[#199119]Unlimited Armament Works[]
block.biomechazard-longbow.details = It was named for its sword-like shape. The Longsword is an upgrade based on the 'Ashlock' Pattern turrets. Using new and considerably better materials makes The Longsword a very reliable weapon for many situations.
block.biomechazard-deadeye.name = Deadeye
block.biomechazard-deadeye.description = A ferociously accurate long-range turret that fires projectiles at an extreme velocity.. \nCapable of destroying most ground target in a single shot.\n[#199119]Unlimited Armament Works[]
block.biomechazard-deadeye.details = Based on the 'Longsword' Pattern turret, it is enhanced with numerous upgrades, including a cutting-edge magnetically charged barrel, accelerating its projectile to a frightening velocity.\n\nSprite by Flin
## Artillery [ART]
block.biomechazard-zounderkite.name = Zounderkite
block.biomechazard-zounderkite.description = Launches mine canisters which bursts in mid-air and deploys various types of landmines.\n[#199119]Unlimited Armament Works[]
block.biomechazard-zounderkite.details = The Tactical Mine Deployment System, commonly known as the T.M.D.S 'Zounderkite'. Capable of turning an empty battlefield into a highly saturated minefield within minutes.\n\nBanned in various places due to its indiscriminate nature.
block.biomechazard-skyhammer.name = Skyhammer
block.biomechazard-skyhammer.description = Fires a huge and very heavy artillery shell at targets over a vast distance. \n\n[accent]Causes multiple repeating aftershocks in the affected area.[]\n[#199119]Unlimited Armament Works[]
block.biomechazard-skyhammer.details = "Thunder roars in the clear skies." \n"Slowly, a howling whistle gets louder, the clouds shatter, then death greets us."
## Energy [EN]
block.biomechazard-heavylight.name = Heavylight
block.biomechazard-heavylight.description = Medium range beam weapon with high rate of fire. Can hit aerial enemy.\n[#199119]Unlimited Armament Works[]
block.biomechazard-heavylight.details = Entry-level energy-based turret. Like most turrets of its type, hard to defend against since it bypasses kinetic projectile shields.\n\nWhen bullets fail to work correctly, the brightest scientist scrambles for an answer; the 'Heavylight' was the result of years of meticulous research.
block.biomechazard-reticence.name = Reticence
block.biomechazard-reticence.description = Discharges powerful energy spheres that temporarily disable enemy units upon impact.\n[#199119]Unlimited Armament Works[]
block.biomechazard-reticence.details = Reticence's energy sphere rarely causes physical damage. It is also slow to fire due to its long charge time, though it can quickly shut down even the most formidable adversaries when employed correctly.
block.biomechazard-trailblazer.name = Trailblazer
block.biomechazard-trailblazer.description = Rapidly discharges high-velocity bolts that unleash arcs of electrical current on impact.\n[#199119]Unlimited Armament Works[]
block.biomechazard-trailblazer.details = The 'Trailblazer' uses somewhat new technology. It overcharges regular rounds to unleash a high-voltage electrical arc that jumps to numerous targets upon impact.\n\nIt may not deal much damage against a heavily armoured target, but it will fry the unarmoured enemy beside or behind the initial impact.
block.biomechazard-sundouser.name = Sundouser
block.biomechazard-sundouser.description = Unleashes a slow-moving, scorching, powerful energy sphere that will obliterate even the most formidable opposition on contact.\n[#199119]Unlimited Armament Works[]
block.biomechazard-sundouser.details = Sluggish and cumbersome to deploy, it even leans towards a liability when used since it drains an ungodly amount of power to just even power up. When it finishes charging, it can even douse the sun.
# Defense
block.biomechazard-force-wall.name = Force Wall
block.biomechazard-force-wall.description = A small wall that can generate a shield when powered.\n[#199119]Unlimited Armament Works[]
block.biomechazard-force-wall.details = It plugs-in with each other, you don't need to individually connect them to power node.
block.biomechazard-stoutsteel-wall.name = Stoutsteel Wall
block.biomechazard-stoutsteel-wall.description = Protects structures from enemy projectiles. Resistant to crushing damage.\n[#199119]Unlimited Armament Works[]
block.biomechazard-stoutsteel-wall-large.name = Large Stoutsteel Wall
block.biomechazard-stoutsteel-wall-large.description = Protects structures from enemy projectiles. Resistant to crushing damage.\n[#199119]Unlimited Armament Works[]
block.biomechazard-rejuvination-projector.name = Rejuvination Projector
block.biomechazard-rejuvination-projector.description = Rapidly repairs buildings in its vicinity, additionally also increase their speed after their health have reached a certain percentage.\n[#199119]Unlimited Armament Works[]
block.biomechazard-rejuvination-dome.name = Rejuvination Dome
block.biomechazard-rejuvination-dome.description = Rapidly repairs buildings in its vicinity, additionally also increase their speed after their health have reached a certain percentage.\n[#199119]Unlimited Armament Works[]
# Unit Blocks
block.biomechazard-air-ground-factory.name = War Facility
block.biomechazard-air-ground-factory.description = Produces air and ground vehicle. Output units can be used directly, or moved into reconstructors for upgrading.\n[#199119]Unlimited Armament Works[]
block.biomechazard-air-ground-factory.details = After the Heavens Fall, the world we once knew no longer the same. Peace and prosperity has taken a certain method of payment, which is blood and oil.
block.biomechazard-naval-factory.name = Naval Yard
block.biomechazard-naval-factory.description = Produces naval vessels. Output units can be used directly, or moved into reconstructors for upgrading.\n[#199119]Unlimited Armament Works[]
block.biomechazard-naval-factory.details = Heavens Fall reveals new land while drowning others, while humanity had tamed the vast ocean centuries ago, in this new age it will not be so different.
block.biomechazard-drone-factory.name = Automaton Assembly Yard
block.biomechazard-drone-factory.description = Produces various automatons to assists in construction, logistics, or supports.\n[#199119]Unlimited Armament Works[]
block.biomechazard-drone-factory.details = What couldn't be done by flesh, steel takes over.
block.biomechazard-exponential-petroleum-reconstructor.name = Exponential Petroleum Reconstructor
block.biomechazard-exponential-petroleum-reconstructor.description = Upgrades Terran Tier 3 units into Tier 4.\n[accent]Can be deployed on[] [blue]water[].\n[#199119]Unlimited Armament Works[]
block.biomechazard-tetrative-petroleum-reconstructor.name = Tetrative Petroleum Reconstructor
block.biomechazard-tetrative-petroleum-reconstructor.description = Upgrades Terran Tier 4 units into Tier 5.\n[accent]Can be deployed on[] [blue]water[].\n[#199119]Unlimited Armament Works[]
block.biomechazard-pentative-petroleum-reconstructor.name = Pentative Petroleum Reconstructor
block.biomechazard-pentative-petroleum-reconstructor.description = Upgrades Terran Tier 5 units into Tier 6.\n[accent]Can be deployed on[] [blue]water[].\n[#199119]Unlimited Armament Works[]
## Air - Attack Helicopter
unit.biomechazard-crotchety.name = Crotchety
unit.biomechazard-crotchety.description = Small helicopter carrying a disproportionally large gun firing cryogenic shots for close ground support.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-crotchety.details = Sluggish and flimsy, one would wonder who had the brilliant idea to put such a large gun on this thing.
unit.biomechazard-aglovale.name = Aglovale
unit.biomechazard-aglovale.description = Fast attack helicopter, strafes enemy with a barrage of machine guns shot and rockets.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-aglovale.details = Legacy of the old world, when piston engines and petroleum ruled the heavens.
unit.biomechazard-bedivere.name = Bedivere
unit.biomechazard-bedivere.description = Strafes enemy unit, its rotor will brutally lacerates enemy unit that get close.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-bedivere.details = Its rotor blades were made with a special composite alloy and complimented with a unique manufacturing process where the blades are forged, giving it a very sword-like appearance and functionality.
unit.biomechazard-calogrenant.name = Calogrenant
unit.biomechazard-calogrenant.description = Moderately armoured and armed to the teeth, it rains down annihilation from above.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-calogrenant.details = The standard attack helicopter for Albion Royal Air Force, its armaments delivers Her Eternal Majesty wrath.
unit.biomechazard-dagonet.name = Dagonet
unit.biomechazard-dagonet.description = Unleashes armour-piercing incendiary shots with unparalleled ferocity, along with an immense swarm of unrelenting missiles to ensures not even ashes would remain.\n\nDue to the amount of firepower it carries, its rotor causes intense downdraft that pushes nearby enemies.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-dagonet.details = The menace of the skies, conqueror of the heavens, and the pinnacle of Albion engineering.
unit.biomechazard-esclabor.name = Esclabor
unit.biomechazard-esclabor.description = Unleashes indiscriminate judgement upon your enemy.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-esclabor.details = Forceful, relentless and unbreakable. Designed to withstand and overturn even the most overwhelming opposition.
## Air - Airships & Carriers
unit.biomechazard-cantankerous.name = Cantankerous
unit.biomechazard-cantankerous.description = Medium-sized and somewhat armoured airship. It fires cryogenic projectiles in a short 2-round burst.\n\nAdditionally, it launches cruise missiles armed with a cryogenic warhead.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-cantankerous.details = It is once the pride of Albion engineers, the ex-ruler of the new skies, quickly becoming obsolete once warfare evolves.
unit.biomechazard-illustrious.name = Illustrious
unit.biomechazard-illustrious.description = Constructs and launches self-detonating gyrocopter drones. It has several machine guns to fend for itself.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-illustrious.details = Illustrious-class flying carriers, constructed in haste after the obsolescence of the Cantankerous airships. \n\nIts invention was based on the thought that mounting a large gun on a flying airship was an awful idea, and instead, its hulls loaded with gyrocopter drones that were made out of cryogenic compounds. \n\nOne would wonder about the thought process of its engineer that leads to this.
unit.biomechazard-indefatigable.name = Indefatigable
unit.biomechazard-indefatigable.description = Constructs and launches a series of autonomous aerial drones that fire bullets relentlessly. Has several machine guns and point defence weapons to fend for itself.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-indefatigable.details = The Indefatigable-class flying carrier was born after the terrible and expensive result of the Illustrious-class flying carrier, boasting thicker armour plating, stronger rotor shafts, and gyrocopter drones that shoot instead of crashing themselves to enemies.
unit.biomechazard-indomitable.name = Indomitable
unit.biomechazard-indomitable.description = A flying warship capable of unleashing perpetual winter on the battlefield and also constructs autonomous gyrocopters that support nearby units.\n[#199119]Unlimited Armament Works[]
## Air - Jets
unit.biomechazard-corsair.name = Corsair
unit.biomechazard-corsair.description = Launches laser-guided bombs at targets that deal more damage to buildings.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-corsair.details = Designated as Corsair FB.15, it is a high-performance fighter bomber suited for destroying ground targets, though it can perform as an aerial superiority fighter if needed.
unit.biomechazard-vindicator.name = Vindicator
unit.biomechazard-vindicator.description = Launches laser guided bomb that causes repeating aftershocks in its affected area.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-vindicator.details = The Vindicator FB.30 flies faster and higher than its previous iteration. It is difficult to intercept without proper air defences.
unit.biomechazard-superfortress.name = Superfortress
unit.biomechazard-superfortress.description = Performs devastating bombing run over its target.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-superfortress.details = The Superfortress B(I).45 is a highly durable aircraft. Its engine can lift payloads much heavier than its weight, though it is sluggish compared to its predecessor.
unit.biomechazard-stratofortress.name = Stratofortress
unit.biomechazard-stratofortress.description = Drops devastating bombs at ground target.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-stratofortress.details = An upgrade to Superfortress B(I).45, designated as Stratofortress B(I).90, is a long-range bomber that can fly terrifyingly fast despite its enormous size and weight.
## Naval - Monitor Warship
unit.biomechazard-arquebus.name = Arquebus
unit.biomechazard-arquebus.description = Small, and sluggish. Carries twin artillery that deals more damage against buildings.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-carronade.name = Carronade
unit.biomechazard-carronade.description = Fires a salvo of shells at enemy defences.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-falconet.name = Falconet
unit.biomechazard-falconet.description = Armed with more point defence weapon along with even more devastating artillery.\n\nThe main artillery causes [white]repeating aftershocks[] in its affected area, [white]denying any building to be built[] while its still in effect.\n[#199119]Unlimited Armament Works[]
## Naval - Torpedo Destroyers
unit.biomechazard-megaera.name = Megaera
unit.biomechazard-megaera.description = Swift and formidable, armed with point defence gun and a single torpedo tubes.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-alecto.name = Alecto
unit.biomechazard-alecto.description = Equipped with machine guns, missile launcher, and double forward-facing torpedo launcher.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-tisiphone.name = Tisiphone
unit.biomechazard-tisiphone.description = Nimble yet moderately armoured, launches very powerful torpedoes and anti-ship cruise missiles.\n[#199119]Unlimited Armament Works[]
## Ground - Main Battle Tanks
unit.biomechazard-cavalier.name = Cavalier
unit.biomechazard-cavalier.description = Fires high-explosive shells and a barrage of bullets at targets.\n\nSuffer less movement penalty on liquid and muddy terrain.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-centurion.name = Centurion
unit.biomechazard-centurion.description = Fires armor-piercing shells, launches missiles, and barrages of bullets at target.\n\nSuffer less movement penalty on liquid and muddy terrain.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-caernarvon.name = Caernarvon
unit.biomechazard-caernarvon.description = Fires powerful armour-piercing composite 'dart' at targets that ignores armour and pierces through force shields, also launches missiles and barrages enemy with bullets.\n\nHas a very thick composite armour, rendering most incoming shots ineffective.\n\nSuffer less movement penalty on liquid and muddy terrain.\n[#199119]Unlimited Armament Works[]
## Ground - Flamethrower Tanks
unit.biomechazard-cavalierF.name = Cavalier Pyrite
unit.biomechazard-cavalierF.description = Armed with a small flamethrower and a main gun that fires short-range incendiary shotgun blasts.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-centurionF.name = Centurion Phlogiston
unit.biomechazard-centurionF.description = [EMPTY]\n[#199119]Unlimited Armament Works[]
unit.biomechazard-caernarvonF.name = Caernarvon Pentecost
unit.biomechazard-caernarvonF.description = [EMPTY]\n[#199119]Unlimited Armament Works[]
## Ground - SPG
unit.biomechazard-abbot.name = Abbot
unit.biomechazard-abbot.description = [EMPTY]\n[#199119]Unlimited Armament Works[]
unit.biomechazard-archer.name = Archer
unit.biomechazard-archer.description = [EMPTY]\n[#199119]Unlimited Armament Works[]
unit.biomechazard-arbalester.name = Arbalester
unit.biomechazard-arbalester.description = [EMPTY]\n[#199119]Unlimited Armament Works[]
unit.biomechazard-arbiter.name = Arbiter
unit.biomechazard-arbiter.description = [EMPTY]\n[#199119]Unlimited Armament Works[]
## Automatons - Construction & Resource Gathering
unit.biomechazard-pellinore.name = Pellinore
unit.biomechazard-pellinore.description = Medium sized aerial mining automaton, has large storage spaces to carry valuable material. Though it cant defend itself and quite fragile.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-percival.name = Percival
unit.biomechazard-percival.description = Large aerial mining automaton, can stow a very hefty amount of material before dumping it out.\n[#199119]Unlimited Armament Works[]
## Automatons - Support
unit.biomechazard-tailwind.name = Tailwind
unit.biomechazard-tailwind.description = Increases moving and firing speed of nearby allies.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-cleric.name = Cleric
unit.biomechazard-cleric-description = Heals nearby allies.\n[#199119]Unlimited Armament Works[]
unit.biomechazard-bulwark.name = Bulwark
unit.biomechazard-bulwark.description = Protects nearby allies with its regenerating shield.\n[#199119]Unlimited Armament Works[]

